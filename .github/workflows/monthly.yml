name: Monthly validation

on:
  schedule:
    - cron: "27 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@839540018daecd394926ddf2104714d7d549ec24 # v0.125.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
