name: Monthly validation

on:
  schedule:
    - cron: "27 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@d3cf40481c3728b8c6b98e3758aa32d114be7dc5 # v0.65.4
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
